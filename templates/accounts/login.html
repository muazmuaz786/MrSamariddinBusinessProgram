{% load static i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'app.css' %}">
  <style>
    .center{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
    .loginbox{width:520px;max-width:92vw;background:white;border-radius:18px;box-shadow:var(--shadow);padding:28px}
    .icon{width:58px;height:58px;border-radius:999px;background:#eef2ff;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
    .title{text-align:center;font-weight:900;font-size:18px}
    .sub{text-align:center;color:var(--muted);margin-top:6px}
    .btnbig{width:100%;padding:14px;border-radius:14px;background:var(--brand);color:white;border:0;font-weight:900;cursor:pointer}
    .err{color:#b91c1c;background:#fee2e2;border:1px solid #fecaca;padding:10px;border-radius:14px;margin-top:12px}
    .field{margin-top:14px}
  </style>
</head>
<body>
  <div class="center">
      <div class="topbar-right">
        <form action="{% url 'set_language' %}" method="post">
          {% csrf_token %}
          <input type="hidden" name="language" value="uz">
          <input type="hidden" name="next" value="{{ request.path }}">
          <button class="lang-btn {% if request.LANGUAGE_CODE == 'uz' %}active{% endif %}">
            O‘zbek
          </button>
        </form>

        <form action="{% url 'set_language' %}" method="post">
          {% csrf_token %}
          <input type="hidden" name="language" value="ru">
          <input type="hidden" name="next" value="{{ request.path }}">
          <button class="lang-btn {% if request.LANGUAGE_CODE == 'ru' %}active{% endif %}">
            Русский
          </button>
        </form>
      </div>

    <div class="loginbox">
      <div class="icon">➡</div>
      <div class="title">{% trans "Welcome" %}</div>
      <div class="sub">{% trans "Enter your details to log in." %}</div>

      {% if error %}<div class="err">{{ error }}</div>{% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label><b>{% trans "Username" %}</b></label>
          <input name="username" required>
        </div>
        <div class="field">
          <label><b>{% trans "Password" %}</b></label>
          <input name="password" type="password" required>
        </div>

        <div style="margin-top:18px">
          <button class="btnbig" type="submit">{% trans "Login" %}</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
