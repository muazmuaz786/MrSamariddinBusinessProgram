{% extends "layout.html" %}
{% load i18n %}

{% block title %}{% trans "Sell product" %}{% endblock %}

{% block content %}
<div class="panel" style="max-width:420px">

  <h2>{% trans "Sell product" %}</h2>

  <p>
    <strong>{{ product.name }}</strong><br>
    {% trans "Available stock" %}: {{ product.stock }}
  </p>

  <form method="post" action="{% url 'sell_product' product.id %}">
    {% csrf_token %}

    <label>{% trans "Quantity" %}</label>
    <input type="number"
           name="quantity"
           min="1"
           max="{{ product.stock }}"
           value="1"
           required>

    <div style="margin-top:16px; display:flex; gap:10px">
      <button type="submit" class="btn primary">
        {% trans "Confirm sale" %}
      </button>

      <a href="{% url 'inventory_list' %}" class="btn">
        {% trans "Cancel" %}
      </a>
    </div>
  </form>

</div>
{% endblock %}
